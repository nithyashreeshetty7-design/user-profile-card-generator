<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile Card Generator</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>User Profile Card Generator</h1>
      <p>Enter your details to create your profile card.</p>

      <form method="POST">
        <input type="text" name="name" placeholder="Enter your name" required />

        <textarea
          name="bio"
          placeholder="Write a short bio"
          required
        ></textarea>

        <input
          type="url"
          name="image"
          placeholder="Enter profile image URL"
          required
        />

        <button type="submit">Generate Profile</button>
      </form>

      {% if profile %}
      <div class="profile-card">
        <img src="{{ profile.image }}" alt="Profile picture" />
        <h2>{{ profile.name }}</h2>
        <p>{{ profile.bio }}</p>
      </div>
      {% endif %}
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
